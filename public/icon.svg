<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f11"/>
      <stop offset="50%" stop-color="#17171c"/>
      <stop offset="100%" stop-color="#08080a"/>
    </linearGradient>
    <linearGradient id="fireGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Rounded App Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#262626" stroke-width="4"/>

  <!-- Glowing Fiery Wing Aura -->
  <path d="M256 64 C350 140 430 230 410 370 C390 440 310 460 256 460 C202 460 122 440 102 370 C82 230 162 140 256 64 Z" fill="url(#fireGrad)" opacity="0.25" filter="url(#glow)"/>

  <!-- Tactical Shield -->
  <path d="M256 96 L384 152 V264 C384 352 328 416 256 448 C184 416 128 352 128 264 V152 Z" fill="#141416" stroke="url(#fireGrad)" stroke-width="12" stroke-linejoin="round"/>

  <!-- Inner Flame Motif -->
  <path d="M256 160 C280 200 310 240 300 290 C290 340 256 360 256 360 C256 360 222 340 212 290 C202 240 232 200 256 160 Z" fill="url(#fireGrad)"/>

  <!-- Central "Q" Stylized Esports Lettermark -->
  <path d="M256 200 C228 200 206 224 206 254 C206 284 228 308 256 308 C270 308 282 302 291 292 L306 314 L324 302 L307 278 C309 270 310 262 310 254 C310 224 288 200 256 200 Z M256 226 C272 226 284 238 284 254 C284 270 272 282 256 282 C240 282 228 270 228 254 C228 238 240 226 256 226 Z" fill="#ffffff" filter="url(#glow)"/>

  <!-- Crown Stars -->
  <polygon points="256,128 262,142 276,142 265,151 269,165 256,156 243,165 247,151 236,142 250,142" fill="url(#goldGrad)"/>
  <polygon points="214,142 218,151 228,151 220,157 223,167 214,161 205,167 208,157 200,151 210,151" fill="url(#goldGrad)" opacity="0.8"/>
  <polygon points="298,142 302,151 312,151 304,157 307,167 298,161 289,167 292,157 284,151 294,151" fill="url(#goldGrad)" opacity="0.8"/>
</svg>
